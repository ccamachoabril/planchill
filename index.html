<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan tranqui Publicis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-outer:#E5DCCA;
    --bg-app:#F6F1E7;
    --dark:#2F4A38;
    --card:#FFFDF8;
    --border:#E4DCCB;
    --text:#1D2320;
    --muted:#5F6659;
    --muted2:#6B7365;
    --accent:#C0512B;
    --accent-dark:#8F3A1C;
    --gold:#E0A020;
    --green:#3E6B4A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg-outer);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-dark)}
  ::-webkit-scrollbar{width:0;height:0}

  @keyframes pulseDot{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- Intro scroll-video (patrón wrapper + spacer + sticky) ---------- */
  .scrub-wrapper{position:relative;width:100%}
  .sticky-video-container{position:sticky;top:0;height:100vh;width:100%;overflow:hidden;background:#12100C;display:flex;align-items:center;justify-content:center}
  .sticky-video-container video{width:100%;height:100%;object-fit:cover;display:block;background:#12100C}
  .scroll-height-spacer{height:400vh;width:100%}
  .intro-sticky video{width:100%;height:100%;object-fit:cover;display:block;background:#12100C}
  .scroll-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;color:#3E6B4A;transition:opacity .45s ease;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .scroll-hint span{font:600 11px/1 'Instrument Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
  .scroll-hint svg{animation:bounce 1.6s ease-in-out infinite}
  .scroll-hint.hidden{opacity:0}
  noscript .intro-scrub, .no-js .intro-scrub{display:none}

  /* ---------- App shell (idéntico al diseño original) ---------- */
  #app{max-width:560px;margin:0 auto;background:var(--bg-app);box-shadow:0 0 0 1px rgba(29,35,32,.06);position:relative}
  .header{background:var(--dark);padding:26px 20px 20px;color:var(--bg-app)}
  .header-top{display:flex;align-items:center;justify-content:space-between}
  .eyebrow{font:600 10.5px/1 'Instrument Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9DB3A2}
  .countdown-pill{display:flex;align-items:center;gap:6px;background:rgba(246,241,231,.12);border-radius:999px;padding:5px 10px}
  .countdown-dot{width:6px;height:6px;border-radius:99px;background:var(--gold);animation:pulseDot 2.2s ease-in-out infinite}
  .countdown-text{font:600 11px/1 'Instrument Sans',sans-serif;color:#EFE8DA}
  .title{margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:29px;line-height:1.05;letter-spacing:-.02em;color:var(--bg-app)}
  .chips{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:500 11.5px/1 'Instrument Sans',sans-serif;color:#DDD6C6;background:rgba(246,241,231,.1);border-radius:7px;padding:6px 9px}

  .tabbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:9px 6px 12px;display:flex;z-index:5}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;cursor:pointer;border-radius:10px;background:none;border:none;font:inherit}
  .tab:hover{background:var(--bg-app)}
  .tab span{font:600 10px/1 'Instrument Sans',sans-serif}

  .section-pad{padding:18px 16px 24px;animation:fadeIn .3s ease}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .section-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:var(--text)}
  .section-hint{font:500 11.5px/1 'Instrument Sans',sans-serif;color:#6B6250}

  .stop-row{display:flex;gap:10px;align-items:stretch}
  .stop-time-col{flex:0 0 46px;text-align:right;padding-top:2px}
  .stop-time{font:700 12.5px/1.3 'Instrument Sans',sans-serif}
  .stop-dot-col{flex:0 0 14px;display:flex;flex-direction:column;align-items:center}
  .stop-dot{width:11px;height:11px;border-radius:99px;border:2px solid var(--bg-app);flex:none;margin-top:3px}
  .stop-line{flex:1;width:2px;background:#E0D7C4;border-radius:2px}
  .stop-body{flex:1;min-width:0;padding-bottom:10px}

  .drive-pill{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px dashed #D5CAB4;border-radius:10px;background:transparent}
  .drive-pill span{font:600 12px/1.3 'Instrument Sans',sans-serif;color:#6B7365}

  .stop-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 13px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(29,35,32,.05);transition:border-color .15s ease}
  .stop-card:hover{border-color:#C9BEA6}
  .stop-card-top{display:flex;align-items:flex-start;gap:10px}
  .stop-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;line-height:1.2;color:var(--text);letter-spacing:-.01em}
  .stop-place{margin-top:4px;font:400 12.5px/1.4 'Instrument Sans',sans-serif;color:var(--muted)}
  .stop-dur{flex:none;font:700 10.5px/1 'Instrument Sans',sans-serif;letter-spacing:.04em;border-radius:6px;padding:5px 7px}
  .stop-detail{margin-top:11px;padding-top:11px;border-top:1px solid #EDE5D5;animation:fadeIn .2s ease}
  .stop-note{font:400 13px/1.55 'Instrument Sans',sans-serif;color:#4F564C}
  .tip-row{margin-top:8px;display:flex;gap:7px;align-items:flex-start}
  .tip-dot{flex:none;margin-top:5px;width:5px;height:5px;border-radius:99px;background:var(--gold)}
  .tip-text{font:400 12.5px/1.5 'Instrument Sans',sans-serif;color:#6B7365}

  .margin-box{margin-top:6px;background:#FBEFD8;border:1px solid #EBD9B4;border-radius:13px;padding:14px}
  .margin-title{font:700 11px/1 'Instrument Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#A0731A}
  .margin-text{margin-top:8px;font:400 13px/1.55 'Instrument Sans',sans-serif;color:#6B5A2E}

  .map-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 12px 8px;box-shadow:0 1px 2px rgba(29,35,32,.05)}
  .map-caption{padding:4px 4px 6px;font:400 10.5px/1.4 'Instrument Sans',sans-serif;color:#6F6656}
  .legs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .leg-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:12px}
  .leg-route{font:600 13.5px/1.3 'Instrument Sans',sans-serif;color:var(--text)}
  .leg-via{margin-top:3px;font:400 12px/1.4 'Instrument Sans',sans-serif;color:var(--muted)}
  .leg-time{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:var(--accent);text-align:right}
  .leg-km{font:500 10.5px/1 'Instrument Sans',sans-serif;color:#6F6656;margin-top:3px;text-align:right}
</style>
</head>
<body>

<!-- ============ INTRO: video controlado por scroll ============ -->
<div class="scrub-wrapper" id="scrubWrapper">
  <div class="sticky-video-container">
    <video id="introVideo" muted playsinline webkit-playsinline preload="auto">
      <source src="assets/intro.mp4" type="video/mp4">
    </video>
    <div class="scroll-hint" id="scrollHint">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      <span>Desliza hacia abajo</span>
    </div>
  </div>
  <div class="scroll-height-spacer"></div>
</div>

<!-- ============ APP: itinerario ============ -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="eyebrow">Plan tranqui Publicis</div>
      <div class="countdown-pill"><span class="countdown-dot"></span><span class="countdown-text" id="countdownText">—</span></div>
    </div>
    <h2 class="title">Sábado 19<br>de septiembre</h2>
    <div class="chips">
      <span class="chip">08:00 – 18:00</span>
      <span class="chip">3 paradas</span>
      <span class="chip">~56 km</span>
    </div>
  </div>

  <div id="viewRuta"></div>
  <div id="viewMapa" style="display:none"></div>

  <div class="tabbar" id="tabbar"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     1) INTRO: video controlado por scroll (estilo Apple)
     ============================================================ */
  var scrubWrapper = document.getElementById('scrubWrapper');
  var video = document.getElementById('introVideo');
  var hint = document.getElementById('scrollHint');
  var unlocked = false;
  var unlockAttempted = false;
  var rafPending = false;
  var videoFailed = false;

  function collapseIntro(reason){
    if (videoFailed) return;
    videoFailed = true;
    console.error('[intro-video] no se pudo cargar/reproducir, se omite el intro:', reason);
    scrubWrapper.style.display = 'none';
  }

  function unlockVideoForScrubbing(){
    if (unlocked || unlockAttempted || videoFailed) return;
    unlockAttempted = true; // solo se intenta UNA vez, pase lo que pase
    var p = video.play();
    if (p && p.then) {
      p.then(function(){
        unlocked = true;
        video.pause();
        updateScrub();
      }).catch(function(err){
        collapseIntro(err);
      });
    } else {
      unlocked = true;
      video.pause();
      updateScrub();
    }
  }

  video.addEventListener('error', function(){
    collapseIntro(video.error);
  });

  function updateScrub(){
    rafPending = false;
    if (videoFailed) return;

    // Igual que codeshack.io/scroll-driven-video-playback: medir la
    // posición REAL del wrapper en cada scroll, en vez de precalcular
    // alturas con vh/innerHeight por separado (eso es lo que se
    // desincronizaba en móviles).
    var rect = scrubWrapper.getBoundingClientRect();
    var scrollHeight = rect.height - window.innerHeight;
    if (scrollHeight <= 0) return;

    var progress = -rect.top / scrollHeight;
    if (progress < 0) progress = 0;
    if (progress > 1) progress = 1;

    if (video.duration && !isNaN(video.duration)) {
      var t = progress * video.duration;
      if (Math.abs(video.currentTime - t) > 0.01) {
        try { video.currentTime = t; } catch(e){}
      }
    }

    if (progress > 0.02) {
      hint.classList.add('hidden');
    } else {
      hint.classList.remove('hidden');
    }
  }

  function onScroll(){
    if (!rafPending) {
      rafPending = true;
      window.requestAnimationFrame(updateScrub);
    }
  }

  video.addEventListener('loadedmetadata', function(){
    updateScrub();
    unlockVideoForScrubbing();
  });
  video.addEventListener('loadeddata', unlockVideoForScrubbing);
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('scroll', unlockVideoForScrubbing, { passive: true, once: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('touchstart', unlockVideoForScrubbing, { passive: true, once: true });
  video.load();
  updateScrub();

  // Si a los 4s el video no ha dado señales de vida, se asume roto y se omite.
  setTimeout(function(){
    if (!unlocked && !videoFailed) collapseIntro('timeout esperando el video');
  }, 4000);

  /* ============================================================
     2) APP: itinerario (Ruta / Mapa)
     ============================================================ */
  var state = {
    tab: 'Ruta',
    open: { 0: true },
    now: Date.now()
  };

  var TONE = {
    meet: ['#E0A020', '#FBEFD8', '#A0731A'],
    stop: ['#3E6B4A', '#E3EADF', '#2F4A38'],
    food: ['#C0512B', '#F8E4DB', '#98421F']
  };

  var STOPS_RAW = [
    { t:'07:45', k:'meet', title:'Punto de encuentro', place:'Redondel del Ciclista, Av. Granados', dur:'15 min',
      note:'Llegamos 07:45 y armamos los autos aquí. Salimos 08:00 en punto.',
      tips:['Falta confirmar con cuántos autos contamos: avisa en el grupo si manejas y cuántos cupos libres tienes.', 'Definan quién va en cada auto antes de arrancar, no en el parqueadero.'] },
    { k:'drive', title:'30 min en auto · bajada al valle' },
    { t:'08:30', k:'meet', title:'Reagrupación', place:'Iglesia de San Gabriel, el valle', dur:'20 min',
      note:'Aquí se suma quien vive en el valle y no tiene que subir a Quito. Última parada con tiendas y baño antes del refugio.',
      tips:['Compren agua y algo de picar acá: dentro del Pasochoa no hay dónde comprar.', 'Si alguien se pierde en el camino, este es el punto de reencuentro.'] },
    { k:'drive', title:'45 min en auto · los últimos 8 km son empedrado y lastre' },
    { t:'09:35', k:'stop', title:'Entrada al Pasochoa', place:'Refugio de Vida Silvestre Pasochoa', dur:'25 min',
      note:'Registro en la caseta, pago de entrada y baño. Desde el parqueadero arrancan los senderos.',
      tips:['Llevar cédula: el registro la pide.', 'Auto bajo puede sufrir en el último tramo; si el tuyo es muy bajo, súbete en otro desde San Gabriel.'] },
    { t:'10:00', k:'stop', title:'Caminata en el bosque', place:'Sendero del bosque nublado', dur:'2 h 30',
      note:'El plan es el sendero del bosque, ida y vuelta, sin subir a la cumbre. Es la parte fuerte del día pero no es técnica: subidas suaves, barro en partes y mucha sombra.',
      tips:['Si vamos tarde, se hace el sendero corto de 1 h 30 y llegamos igual a la hora.', 'Zapato cerrado con buen agarre: el bosque mantiene barro aunque no llueva.', 'El clima cambia rápido, lleva chompa impermeable aunque amanezca despejado.'] },
    { k:'drive', title:'40 min en auto · del refugio a Angamarca' },
    { t:'13:10', k:'food', title:'Llegada y carbón', place:'Sueños de Abril II, Angamarca', dur:'1 h 20',
      note:'Un auto puede adelantarse para prender el carbón: la brasa necesita 40 min para estar lista.',
      tips:['Mientras prende el carbón: sacar mesas, hielo y bebidas.', 'La comida vegetariana entra primero a la parrilla, antes de la carne.'] },
    { t:'14:30', k:'food', title:'Parrillada', place:'Casa Familia Abril', dur:'2 h 30',
      note:'El plan central del día. Se sirve 14:30, se come sin prisa y con hambre real después de caminar.',
      tips:['Turnos de parrilla de 30 min, así nadie se pierde la comida.', 'Una funda de basura desde el inicio: recogemos sobre la marcha.'] },
    { t:'17:00', k:'stop', title:'Sobremesa', place:'Y juegos de mesa (guiño, guiño)', dur:'1 h',
      note:'Café, postre y descanso de piernas.',
      tips:['Entra viento frío después de las 16:00: chompa a mano.'] },
    { t:'18:00', k:'meet', title:'Cierre y regreso', place:'Salida hacia Quito y el valle', dur:'—',
      note:'Salimos con luz. Quien manejó no toma; si alguien tomó, se queda o cambia de conductor.',
      tips:['Aviso al grupo cuando cada auto llegue a casa.'] }
  ];

  var LEGS = [
    { from:'Redondel', to:'San Gabriel', via:'Av. Granados y Rumiñahui, bajada al valle', min:'30 min', km:'~18 km' },
    { from:'San Gabriel', to:'Pasochoa', via:'Vía al refugio, empedrado los últimos 8 km', min:'45 min', km:'~20 km' },
    { from:'Pasochoa', to:'Angamarca', via:'Sueños de Abril II, la casa', min:'40 min', km:'~18 km' }
  ];

  var TAB_DEFS = [
    ['Ruta', 'M4 19h5.5A4.5 4.5 0 0 0 14 14.5V9a3 3 0 0 1 3-3h3M4 19l3-3m-3 3 3 3M20 6l-3-3m3 3-3 3'],
    ['Mapa', 'M9 4 3 6.2V20l6-2.2 6 2.2 6-2.2V4l-6 2.2L9 4v13.8']
  ];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function countdown(){
    var target = new Date(2026, 8, 19, 8, 0, 0).getTime();
    var d = target - state.now;
    if (d <= 0) return '¡Hoy es el día!';
    var days = Math.floor(d / 86400000);
    var hrs = Math.floor((d % 86400000) / 3600000);
    var min = Math.floor((d % 3600000) / 60000);
    if (days > 0) return 'faltan ' + days + ' d ' + hrs + ' h';
    return 'faltan ' + hrs + ' h ' + min + ' m';
  }

  function renderStopCard(s, i){
    if (s.k === 'drive') {
      return '' +
        '<div class="stop-row">' +
          '<div class="stop-time-col"><div class="stop-time" style="color:#6F6656"></div></div>' +
          '<div class="stop-dot-col"><span class="stop-dot" style="background:#F6F1E7;border-color:#D5CAB4"></span><span class="stop-line"></span></div>' +
          '<div class="stop-body">' +
            '<div class="drive-pill">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6250" stroke-width="2" stroke-linecap="round"><path d="M5 17h14M6 17V11l2-4h8l2 4v6"></path><circle cx="8" cy="17" r="1.6"></circle><circle cx="16" cy="17" r="1.6"></circle></svg>' +
              '<span>' + esc(s.title) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    var c = TONE[s.k];
    var isOpen = !!state.open[i];
    var detail = '';
    if (isOpen) {
      var tips = s.tips.map(function(tip){
        return '<div class="tip-row"><span class="tip-dot"></span><span class="tip-text">' + esc(tip) + '</span></div>';
      }).join('');
      detail = '<div class="stop-detail"><div class="stop-note">' + esc(s.note) + '</div>' + tips + '</div>';
    }

    return '' +
      '<div class="stop-row">' +
        '<div class="stop-time-col"><div class="stop-time" style="color:#1D2320">' + esc(s.t) + '</div></div>' +
        '<div class="stop-dot-col"><span class="stop-dot" style="background:' + c[0] + '"></span><span class="stop-line"></span></div>' +
        '<div class="stop-body">' +
          '<div class="stop-card" data-toggle="' + i + '">' +
            '<div class="stop-card-top">' +
              '<div style="flex:1;min-width:0">' +
                '<div class="stop-title">' + esc(s.title) + '</div>' +
                '<div class="stop-place">' + esc(s.place) + '</div>' +
              '</div>' +
              '<span class="stop-dur" style="color:' + c[2] + ';background:' + c[1] + '">' + esc(s.dur) + '</span>' +
            '</div>' +
            detail +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderRuta(){
    var rows = STOPS_RAW.map(renderStopCard).join('');
    return '' +
      '<div class="section-pad">' +
        '<div class="section-head"><div class="section-title">Itinerario</div><div class="section-hint">toca una parada</div></div>' +
        rows +
        '<div class="margin-box">' +
          '<div class="margin-title">Dónde está el margen</div>' +
          '<div class="margin-text">La caminata en el Pasochoa es lo único elástico del día. El sendero corto toma 1 h 30 y el del bosque 2 h 30: si salimos tarde del punto de encuentro, se hace el corto y la parrillada no se mueve.</div>' +
        '</div>' +
      '</div>';
  }

  function renderMapa(){
    var legs = LEGS.map(function(l){
      return '' +
        '<div class="leg-card">' +
          '<div style="flex:1;min-width:0">' +
            '<div class="leg-route">' + esc(l.from) + ' → ' + esc(l.to) + '</div>' +
            '<div class="leg-via">' + esc(l.via) + '</div>' +
          '</div>' +
          '<div style="flex:none">' +
            '<div class="leg-time">' + esc(l.min) + '</div>' +
            '<div class="leg-km">' + esc(l.km) + '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    return '' +
      '<div class="section-pad">' +
        '<div class="section-title" style="margin-bottom:12px">La ruta</div>' +
        '<div class="map-card">' +
          '<svg viewBox="0 0 340 250" width="100%" style="display:block">' +
            '<path d="M118 196 L196 84 L274 196 Z" fill="#CFDCC9"></path>' +
            '<path d="M196 84 L226 127 L214 133 L200 122 L186 134 L166 127 Z" fill="#E3EADF"></path>' +
            '<text x="196" y="172" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="10" font-weight="700" fill="#2F4A38">Pasochoa</text>' +
            '<text x="196" y="185" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="8.5" fill="#5F6659">4.200 m</text>' +
            '<path d="M38 62 C74 74 96 92 118 118 C144 148 170 174 208 200" fill="none" stroke="#C0512B" stroke-width="3" stroke-linecap="round"></path>' +
            '<path d="M208 200 C246 216 282 208 300 176" fill="none" stroke="#C0512B" stroke-width="3" stroke-linecap="round"></path>' +
            '<g font-family="Instrument Sans, sans-serif">' +
              '<circle cx="38" cy="62" r="11" fill="#E0A020"></circle><text x="38" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#3D2C08">1</text>' +
              '<text x="38" y="36" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D2320">Redondel</text>' +
              '<text x="38" y="46" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D2320">del Ciclista</text>' +
              '<circle cx="118" cy="118" r="11" fill="#3E6B4A"></circle><text x="118" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#F6F1E7">2</text>' +
              '<text x="70" y="106" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D2320">San Gabriel</text>' +
              '<text x="70" y="116" text-anchor="middle" font-size="9" fill="#5F6659">el valle</text>' +
              '<circle cx="208" cy="200" r="11" fill="#3E6B4A"></circle><text x="208" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#F6F1E7">3</text>' +
              '<text x="200" y="224" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D2320">Refugio Pasochoa</text>' +
              '<text x="200" y="234" text-anchor="middle" font-size="9" fill="#5F6659">caminata</text>' +
              '<circle cx="300" cy="176" r="11" fill="#1D2320"></circle><text x="300" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#F6F1E7">4</text>' +
              '<text x="302" y="152" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D2320">Angamarca</text>' +
              '<text x="302" y="142" text-anchor="middle" font-size="9" fill="#5F6659">la parrillada</text>' +
            '</g>' +
          '</svg>' +
          '<div class="map-caption">Esquema de orientación, no a escala. Las distancias reales van abajo.</div>' +
        '</div>' +
        '<div class="legs">' + legs + '</div>' +
      '</div>';
  }

  function renderTabs(){
    return TAB_DEFS.map(function(def){
      var label = def[0], icon = def[1];
      var active = state.tab === label;
      var color = active ? '#C0512B' : '#A79C86';
      return '' +
        '<button class="tab" data-tab="' + label + '">' +
          '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + icon + '"></path></svg>' +
          '<span style="color:' + color + '">' + label + '</span>' +
        '</button>';
    }).join('');
  }

  function render(){
    document.getElementById('countdownText').textContent = countdown();
    document.getElementById('viewRuta').style.display = state.tab === 'Ruta' ? '' : 'none';
    document.getElementById('viewMapa').style.display = state.tab === 'Mapa' ? '' : 'none';
    document.getElementById('viewRuta').innerHTML = renderRuta();
    document.getElementById('viewMapa').innerHTML = renderMapa();
    document.getElementById('tabbar').innerHTML = renderTabs();
  }

  document.getElementById('app').addEventListener('click', function(e){
    var toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      var idx = toggle.getAttribute('data-toggle');
      state.open[idx] = !state.open[idx];
      render();
      return;
    }
    var tab = e.target.closest('[data-tab]');
    if (tab) {
      state.tab = tab.getAttribute('data-tab');
      render();
    }
  });

  render();
  setInterval(function(){
    state.now = Date.now();
    document.getElementById('countdownText').textContent = countdown();
  }, 30000);

})();
</script>
</body>
</html>
